name: 更新贡献卡片

on:
  workflow_dispatch:
  schedule:
    # 每天 23:59 北京时间 (UTC+8 → 15:59 UTC)
    - cron: '59 15 * * *'

# 统计产物发布到 GitHub Pages，不向 main 写入任何提交
permissions:
  contents: read
  pages: write
  id-token: write
  # 固定 key 的克隆缓存不可覆盖，保存前要先删旧条目
  actions: write

# 同一时间只保留一个实例：手动触发撞上定时任务时排队执行，
# 避免两个运行同时部署或互相覆盖缓存
concurrency:
  group: update-stats
  cancel-in-progress: false

jobs:
  update-stats:
    runs-on: ubuntu-latest
    # 统计脚本内部 25 分钟超时，camo 同步最多再等 5 分钟，留出余量避免被整体掐断
    timeout-minutes: 40
    environment:
      name: github-pages
      # 数据无变化会跳过部署，此时 deployment 输出为空，用仓库名拼出地址
      url: ${{ steps.deployment.outputs.page_url || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}

    steps:
      # 检出代码仓库：统计脚本的 git 操作都作用于 temp_repos 下被统计的仓库，
      # 本仓库只读 README 的配置默认值，不需要完整历史
      - name: 检出代码仓库
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # 设置 Node
      - name: 设置 Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 配置 Pages（仓库设置里 Source 需选 GitHub Actions）
      - name: 配置 Pages
        uses: actions/configure-pages@v5

      # 确定目标用户：上游仓库由统计脚本从各仓库的 source/parent 字段自行解析，
      # 这里只需给出账号名，不必再查一次仓库元数据
      - name: 确定目标用户
        id: determine-users
        run: |
          echo "🔍 正在确定统计目标..."
          echo "T_START=$(date +%s)" >> $GITHUB_ENV

          ORIGIN_USERNAME="${{ github.repository_owner }}"
          echo "ORIGIN_USERNAME=$ORIGIN_USERNAME" >> $GITHUB_OUTPUT
          # 下一步是 cache/restore，记下边界时间即可算出它的用时
          echo "T_CACHE=$(date +%s)" >> $GITHUB_ENV
          echo "✅ 目标用户: $ORIGIN_USERNAME"

      # 恢复上次的仓库克隆，本次只需增量 fetch
      - name: 恢复仓库克隆缓存
        uses: actions/cache/restore@v4
        with:
          path: temp_repos
          # 固定 key：复用同一份克隆，不按 run_id 逐次累积缓存条目
          key: stats-repos

      # 统计缓存由 Pages 托管：跑之前从站点拉回，跑完连同卡片一起部署
      - name: 从 Pages 恢复统计缓存
        id: restore-cache
        run: |
          start=$(date +%s)
          # 本步开始到上一步结束之间只隔着 cache/restore
          echo "SEC_CLONE=$(( start - ${T_CACHE:-$start} ))" >> $GITHUB_ENV
          node scripts/pipeline.js restore && rc=0 || rc=$?
          echo "SEC_RESTORE=$(( $(date +%s) - start ))" >> $GITHUB_ENV
          exit $rc

      # 生成统计数据
      - name: 生成统计数据
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EMAILS_TOKEN: ${{ secrets.EMAILS_TOKEN }}
          ORIGIN_USERNAME: ${{ steps.determine-users.outputs.ORIGIN_USERNAME }}
        run: |
          echo "🚀 开始生成统计数据..."
          echo "👤 目标用户: $ORIGIN_USERNAME"
          echo "📊 仓库: ${{ github.repository }}"

          # 验证环境变量
          if [ -z "$GH_TOKEN" ]; then
            echo "❌ 错误: GH_TOKEN 未设置"
            exit 1
          fi

          if [ -z "$ORIGIN_USERNAME" ]; then
            echo "❌ 错误: ORIGIN_USERNAME 未设置"
            exit 1
          fi

          # 运行脚本，带超时和错误处理
          start=$(date +%s)
          timeout 25m node scripts/generate_stats.js && rc=0 || rc=$?
          # 失败也要记下用时，摘要才看得出卡在哪
          echo "SEC_STATS=$(( $(date +%s) - start ))" >> $GITHUB_ENV
          if [ "$rc" -ne 0 ]; then
            echo "❌ 统计生成失败或超时"
            exit 1
          fi

          echo "✅ 统计数据生成成功"

      # 保存本次克隆，供下次增量使用（仓库克隆不适合放 Pages，仍走 Actions 缓存）。
      # 固定 key 无法覆盖写入，先删旧条目再存，避免每次运行都累积一份
      - name: 删除旧的克隆缓存
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh cache delete stats-repos --repo "${{ github.repository }}" > /dev/null 2>&1 || true

      - name: 保存仓库克隆缓存
        if: always()
        uses: actions/cache/save@v4
        with:
          path: temp_repos
          key: stats-repos

      # 卡片 + 统计缓存一起托管，站点上都能直接打开查看
      - name: 准备 Pages 产物
        id: prepare-site
        run: |
          start=$(date +%s)
          node scripts/pipeline.js site && rc=0 || rc=$?
          echo "SEC_SITE=$(( $(date +%s) - start ))" >> $GITHUB_ENV
          # 上传和部署是两个 uses 步骤，把边界时间交给下一步算
          echo "T_DEPLOY=$(date +%s)" >> $GITHUB_ENV
          exit $rc

      # 卡片字节没变时站点内容完全相同，跳过部署与清缓存，省下一分钟部署和最长五分钟轮询
      - name: 上传 Pages 产物
        if: steps.prepare-site.outputs.unchanged != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: 部署到 Pages
        id: deployment
        if: steps.prepare-site.outputs.unchanged != 'true'
        uses: actions/deploy-pages@v4

      # GitHub 的 camo 图片代理按源站 Cache-Control 缓存，Pages 固定 max-age=600。
      # 部署完成后清除该卡片的 camo 缓存，新访客即可取到本次生成的版本
      - name: 刷新 camo 缓存
        id: purge
        if: steps.prepare-site.outputs.unchanged != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          start=$(date +%s)
          if [ -n "$T_DEPLOY" ]; then
            echo "SEC_DEPLOY=$(( start - T_DEPLOY ))" >> $GITHUB_ENV
          fi
          node scripts/pipeline.js purge && rc=0 || rc=$?
          echo "SEC_PURGE=$(( $(date +%s) - start ))" >> $GITHUB_ENV
          exit $rc

      # 运行摘要：写入 Step Summary，显示在 Actions 运行页顶部
      - name: 摘要
        if: always()
        env:
          EVENT_NAME: ${{ github.event_name }}
          ORIGIN: ${{ steps.determine-users.outputs.ORIGIN_USERNAME }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          DEPLOY: ${{ steps.deployment.outcome }}
          UNCHANGED: ${{ steps.prepare-site.outputs.unchanged }}
          RESTORED: ${{ steps.restore-cache.outputs.restored }}
          RESTORE_FAILED: ${{ steps.restore-cache.outputs.failed }}
          PURGE_RESULT: ${{ steps.purge.outputs.result }}
          PURGE_DETAIL: ${{ steps.purge.outputs.detail }}
        run: |
          if [ -n "$T_START" ]; then
            export SEC_TOTAL=$(( $(date +%s) - T_START ))
          fi
          node scripts/pipeline.js summary
