name: 更新贡献卡片

on:
  workflow_dispatch:
  schedule:
    # 每天 23:59 北京时间 (UTC+8 → 15:59 UTC)
    - cron: '59 15 * * *'

# 统计产物发布到 GitHub Pages，不向 main 写入任何提交
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只保留一个实例：手动触发撞上定时任务时排队执行，
# 避免两个运行同时部署或互相覆盖缓存
concurrency:
  group: update-stats
  cancel-in-progress: false

jobs:
  update-stats:
    runs-on: ubuntu-latest
    # 统计脚本内部 25 分钟超时，camo 同步最多再等 5 分钟，留出余量避免被整体掐断
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # 检出代码仓库
      - name: 检出代码仓库
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # 获取完整历史以便更好的 git log 分析

      # 设置 Python
      - name: 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # 配置 Pages（仓库设置里 Source 需选 GitHub Actions）
      - name: 配置 Pages
        uses: actions/configure-pages@v5

      # 确定目标用户
      - name: 确定目标用户
        id: determine-users
        run: |
          echo "🔍 正在确定统计目标..."

          # 通过查询 GitHub API 检查是否为 Fork 仓库
          REPO_INFO=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}")

          IS_FORK=$(echo "$REPO_INFO" | jq -r '.fork // false')
          REPO_OWNER_ID=$(echo "$REPO_INFO" | jq -r '.owner.id // empty')

          if [ "$IS_FORK" = "true" ]; then
            # 这是 Fork 仓库
            ORIGIN_USERNAME="${{ github.repository_owner }}"
            UPSTREAM_USERNAME=$(echo "$REPO_INFO" | jq -r '.parent.owner.login // .source.owner.login // empty')

            if [ -n "$UPSTREAM_USERNAME" ] && [ "$UPSTREAM_USERNAME" != "null" ]; then
              echo "🍴 检测到 Fork 仓库"
              echo "👤 远端用户名: $ORIGIN_USERNAME"
              echo "👑 上游用户名: $UPSTREAM_USERNAME"
            else
              UPSTREAM_USERNAME="$ORIGIN_USERNAME"
              echo "🍴 Fork 仓库但无法获取上游信息"
              echo "👤 远端用户名: $ORIGIN_USERNAME"
              echo "👑 上游用户名: $UPSTREAM_USERNAME"
            fi
          else
            # 这是原始仓库
            ORIGIN_USERNAME="${{ github.repository_owner }}"
            UPSTREAM_USERNAME="${{ github.repository_owner }}"
            echo "📦 检测到原始仓库"
            echo "👤 远端用户名: $ORIGIN_USERNAME"
            echo "👑 上游用户名: $UPSTREAM_USERNAME"
          fi

          if [ -z "$REPO_OWNER_ID" ] || [ "$REPO_OWNER_ID" = "null" ]; then
            echo "❌ 错误: 无法获取远端用户 ID"
            exit 1
          fi

          echo "ORIGIN_USERNAME=$ORIGIN_USERNAME" >> $GITHUB_OUTPUT
          echo "UPSTREAM_USERNAME=$UPSTREAM_USERNAME" >> $GITHUB_OUTPUT
          echo "✅ 目标用户已确定"

      # 恢复上次的仓库克隆，本次只需增量 fetch
      - name: 恢复仓库克隆缓存
        uses: actions/cache/restore@v4
        with:
          path: temp_repos
          key: stats-repos-${{ github.run_id }}
          restore-keys: |
            stats-repos-

      # 统计缓存由 Pages 托管：跑之前从站点拉回，跑完连同卡片一起部署
      - name: 从 Pages 恢复统计缓存
        id: restore-cache
        run: python3 scripts/pipeline.py restore

      # 生成统计数据
      - name: 生成统计数据
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EMAILS_TOKEN: ${{ secrets.EMAILS_TOKEN }}
          ORIGIN_USERNAME: ${{ steps.determine-users.outputs.ORIGIN_USERNAME }}
          UPSTREAM_USERNAME: ${{ steps.determine-users.outputs.UPSTREAM_USERNAME }}
        run: |
          echo "🚀 开始生成统计数据..."
          echo "👤 目标用户: $ORIGIN_USERNAME"
          echo "📊 仓库: ${{ github.repository }}"

          # 验证环境变量
          if [ -z "$GH_TOKEN" ]; then
            echo "❌ 错误: GH_TOKEN 未设置"
            exit 1
          fi

          if [ -z "$ORIGIN_USERNAME" ]; then
            echo "❌ 错误: ORIGIN_USERNAME 未设置"
            exit 1
          fi

          # 运行脚本，带超时和错误处理
          timeout 25m python3 scripts/generate_stats.py || {
            echo "❌ 统计生成失败或超时"
            exit 1
          }

          echo "✅ 统计数据生成成功"

      # 保存本次克隆，供下次增量使用（仓库克隆不适合放 Pages，仍走 Actions 缓存）
      - name: 保存仓库克隆缓存
        if: always()
        uses: actions/cache/save@v4
        with:
          path: temp_repos
          key: stats-repos-${{ github.run_id }}

      # 卡片 + 统计缓存一起托管，站点上都能直接打开查看
      - name: 准备 Pages 产物
        id: prepare-site
        run: python3 scripts/pipeline.py site

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: 部署到 Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # GitHub 的 camo 图片代理按源站 Cache-Control 缓存，Pages 固定 max-age=600。
      # 部署完成后清除该卡片的 camo 缓存，新访客即可取到本次生成的版本
      - name: 刷新 camo 缓存
        id: purge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: python3 scripts/pipeline.py purge

      # 运行摘要：写入 Step Summary，显示在 Actions 运行页顶部
      - name: 摘要
        if: always()
        env:
          EVENT_NAME: ${{ github.event_name }}
          ORIGIN: ${{ steps.determine-users.outputs.ORIGIN_USERNAME }}
          UPSTREAM: ${{ steps.determine-users.outputs.UPSTREAM_USERNAME }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          DEPLOY: ${{ steps.deployment.outcome }}
          RESTORED: ${{ steps.restore-cache.outputs.restored }}
          RESTORE_FAILED: ${{ steps.restore-cache.outputs.failed }}
          PURGE_RESULT: ${{ steps.purge.outputs.result }}
          PURGE_DETAIL: ${{ steps.purge.outputs.detail }}
        run: python3 scripts/pipeline.py summary
