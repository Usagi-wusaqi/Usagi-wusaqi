name: Lint Check

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 不装任何依赖，只用 Node 自带的语法检查
      - name: Syntax check
        run: node scripts/lint.js

      - name: Run tests
        run: node --test
