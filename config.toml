# generate_stats.js 配置
# 作者邮箱在运行时通过 GitHub API 获取，仅保存在内存中，不写入本文件

# ---- GitHub API ----
[api]
# GitHub REST API 基础地址（通常无需修改；GraphQL 请求也发往这个地址的 /graphql）
github_api_base = "https://api.github.com"
# 分页请求的最大页数（贡献仓库清单按每页 100 条翻页）
max_api_pages = 10
# 每页返回条目数（GitHub 最大支持 100）
per_page = 100
# 剩余配额低于此值时打印警告
rate_limit_warn_threshold = 50

# ---- 统计范围 ----
[repos]
# 统计范围只有一个来源：GraphQL 的 repositoriesContributedTo，直接列出「我提交过
# 的仓库」，一次翻 100 个、游标翻页拿全，返回结果自带 fork 与上游关系。查询里带了
# includeUserRepositories: true，名下有自己提交的仓库本来就包含在内；一次提交都没有
# 的仓库不进统计，它们对卡片是零贡献，克隆下来只是白跑。
# 口径按账号归属、只看默认分支，比主页贡献图窄一点：贡献图还数 gh-pages 上的提交，
# 那里放的是页面而不是代码，不计入行数。
# 查询完整时名单以本轮为准，仓库删除、转私有、失去访问权都会自然退出；查询失败或
# 翻页中断时与上轮合并、只增不减，不会因为一次失败把已统计的仓库丢掉。
# 注意：这一步必须用账号本人的令牌（EMAILS_TOKEN），Actions 内置令牌的身份是
# bot，查到的是它自己的贡献。名单整个重建就删掉 scripts/stats_cache/scope/index.json
# 后直接跑 generate_stats.js；走 pipeline 或 CI 时这份缓存会先被 restore 从站点取回，
# 删本地文件不起作用
# 设为 false 则跳过查询，只统计下面的 include 清单
discover = true
# 无论是否自动查询，都额外统计这些仓库（owner/name 或仓库地址）；私有仓库、
# 以及不存在或无权访问的都会剔除；用来补查询漏掉的仓库；一条一行、末尾逗号可有可无
include = []
# 不管来自哪个来源，都从统计范围里剔除的仓库（owner/name），如内容重复的镜像仓
exclude = []

# ---- SVG 卡片 ----
[svg]
# 卡片标题文本（设为空字符串则不显示标题）
custom_title = "Code Contributions"
# 标题颜色
title_color = "#2f80ed"
# 正文文字颜色
text_color = "#434d58"
# 卡片背景颜色
bg_color = "#fffefe"
# 卡片边框颜色（透明）
border_color = "#ffffff00"
# Additions 数值颜色
add_color = "#28a745"
# Deletions 数值颜色
del_color = "#d73a49"
# Images 数值颜色
img_color = "#6f42c1"
# 卡片宽度（像素）
width = 1200
# 卡片高度（像素）
height = 200

# SVG 布局（像素）
[svg.layout]
# 左右内边距
padding = 67
# 标题 Y 坐标
title_y = 70
# 统计数据行 Y 坐标
stats_y = 120
# 数值与标签的垂直间距
value_gap = 36
# 卡片圆角半径
border_radius = 4.5

# SVG 字体
[svg.font]
# 主字体族
family = "'Segoe UI', Ubuntu, Sans-Serif"
# 扩展字体族（备用）
family_extended = "'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif"
# 标题字体大小（含字重）
header_size = "600 48px"
# Firefox 下标题字体大小修正
header_size_firefox = "41px"
# 统计标签字体大小（含字重）
stat_size = "600 20px"
# 数值字体大小（含字重）
bold_size = "700 36px"

# SVG 列标签
[svg.labels]
# 新增行数列标题
additions = "Additions"
# 删除行数列标题
deletions = "Deletions"
# 净增行数列标题
net = "Net"
# 图片数量列标题
images = "Images"

# ---- 运行行为 ----
[behavior]
# 被识别为图片的文件扩展名列表
image_extensions = [".png", ".jpg", ".jpeg", ".gif", ".bmp", ".svg", ".webp", ".ico"]
# 每处理多少个 commit 打印一次进度
progress_interval = 10
# 控制台分隔线宽度（字符数）
separator_length = 60
# 并发处理的仓库数（GitHub 侧为网络等待型任务，无需设太高）
concurrency = 6
